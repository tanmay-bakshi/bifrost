[package]
name = "sshportal-ios"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0.103"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sshportal = { path = "../.." }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7.16"

[dev-dependencies]
tokio-tungstenite = { version = "0.28.0", features = ["__rustls-tls"] }
